<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#3730A3" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="cap-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Background Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  
  <!-- Outer Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#accent-grad)" stroke-width="6" stroke-opacity="0.4" />
  
  <!-- Network Hub Connections (Background Nodes) -->
  <g opacity="0.3" stroke="url(#accent-grad)" stroke-width="4" stroke-dasharray="8 6">
    <line x1="256" y1="160" x2="120" y2="340" />
    <line x1="256" y1="160" x2="392" y2="340" />
    <line x1="120" y1="340" x2="392" y2="340" />
  </g>

  <!-- Hub Nodes -->
  <circle cx="120" cy="340" r="16" fill="#38BDF8" />
  <circle cx="392" cy="340" r="16" fill="#38BDF8" />
  <circle cx="256" cy="420" r="12" fill="#818CF8" />

  <!-- Capstone Graduation Cap + Hub Icon Group -->
  <g filter="url(#shadow)">
    <!-- Cap Diamond / Top -->
    <polygon points="256,110 430,190 256,270 82,190" fill="url(#cap-grad)" />

    <!-- Cap Under-rim Shadow -->
    <polygon points="256,270 430,190 400,205 256,278 112,205 82,190" fill="#C7D2FE" opacity="0.8" />

    <!-- Cap Skull Base / Cap Skull Structure -->
    <path d="M150,225 L150,295 C150,335 200,360 256,360 C312,360 362,335 362,295 L362,225 C335,245 298,258 256,258 C214,258 177,245 150,225 Z" fill="url(#accent-grad)" />

    <!-- Tassel String -->
    <path d="M400,195 Q380,240 372,280" fill="none" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" />
    
    <!-- Tassel Ring / Button -->
    <circle cx="256" cy="190" r="10" fill="#F59E0B" />
    
    <!-- Tassel Fringe -->
    <polygon points="372,280 364,325 380,325" fill="#FBBF24" />
  </g>
</svg>